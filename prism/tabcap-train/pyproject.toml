[project]
name = "tabcap-train"
version = "0"
requires-python = ">=3.14"
# numpy, scipy, opencv and pillow come pinned with prism (the front step)
dependencies = ["prism"]

[dependency-groups]
train = ["torch==2.15.0", "onnx==1.23.2"]
dev = ["black==26.10.1", "flake8==7.5.0", "isort==9.0.2", "pytest==9.2.0"]

[tool.uv]
package = false
exclude-newer = "1 week"

[tool.uv.sources]
prism = { path = "..", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Own section: else black uses prism's config, which excludes this dir.
# Hooks: prism/.pre-commit-config.yaml (tabcap-train-*).
[tool.black]
extend-exclude = '^/results/'

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]

[tool.isort]
profile = "black"
known_first_party = ["prism"]
skip = ".venv,results"
