[project]
name = "tabcap-lab"
version = "0"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python-headless",
    "rapidfuzz",
    "pytesseract>=0.3.13",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.32.0",
]

[dependency-groups]
# CRNN training only (i4_train.py): uv sync --group train
train = ["torch==2.15.0", "onnx>=1.23"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
