name: Test and build

permissions:
    contents: read

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    lint-and-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint:check

            - name: Unit tests
              run: pnpm run test:unit

            - name: Build
              run: pnpm run build

            - name: Check route tree is up to date
              run: |
                  if ! git diff --exit-code src/routeTree.gen.ts; then
                      echo "Error: The route tree file (src/routeTree.gen.ts) is not up to date."
                      echo "Run 'pnpm run build' and commit the changes."
                      exit 1
                  fi
                  echo "Route tree is up to date ✓"

            - name: Check node types
              run: pnpm run tsc:node

    deploy:
        # Fork PRs get no secrets. To deploy one, review it and push it to a branch here.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        name: Deploy to Cloudflare Pages
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        concurrency:
            group: pages-deploy-${{ github.head_ref || github.ref_name }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              env:
                  # Upload source maps for the files we deploy
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              run: pnpm run build

            - name: Pick Pages branch
              id: branch
              env:
                  EVENT: ${{ github.event_name }}
                  REF: ${{ github.ref_name }}
                  HEAD_REF: ${{ github.head_ref }}
              # main is the Pages production branch; every other branch is a preview
              run: |
                  if [ "$EVENT" = "push" ] && [ "$REF" = "main" ]; then
                      branch="main"
                  elif [ "$EVENT" = "pull_request" ]; then
                      branch="pr-$HEAD_REF"
                  else
                      echo "Unknown event $EVENT on $REF, not deploying"
                      exit 1
                  fi
                  echo "Pages branch: $branch"
                  echo "name=$branch" >> "$GITHUB_OUTPUT"

            - name: Deploy
              id: deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  BRANCH: ${{ steps.branch.outputs.name }}
                  WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
              run: |
                  pnpm exec wrangler pages deploy dist --project-name rainbow --branch "$BRANCH"
                  # Pages shortens long aliases (sometimes with a hash), so read it from wrangler
                  alias=$(jq -r 'select(.type == "pages-deploy-detailed") | .alias // empty' "$WRANGLER_OUTPUT_FILE_PATH")
                  if [ -z "$alias" ]; then
                      echo "No alias URL in wrangler output"
                      exit 1
                  fi
                  echo "alias=$alias" >> "$GITHUB_OUTPUT"

            - name: Comment preview URL
              if: ${{ github.event_name == 'pull_request' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.number }}
                  SHA: ${{ github.event.pull_request.head.sha }}
                  URL: ${{ steps.deploy.outputs.alias }}
              run: |
                  gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $URL (commit $SHA)"

    ui-tests:
        runs-on: ubuntu-latest
        container:
            # https://mcr.microsoft.com/en-us/artifact/mar/playwright/tags
            image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
            options: --ipc=host
        strategy:
            matrix:
                include:
                    - { browser: chromium, shard: 1, total: 3 }
                    - { browser: chromium, shard: 2, total: 3 }
                    - { browser: chromium, shard: 3, total: 3 }
            fail-fast: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test
              timeout-minutes: 10
              run: pnpm run test:ui:${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.total }}
